{% extends "base.html" %}
{% block title %}Ordini - MSG 3.0{% endblock %}
{% block content %}
<h1>Ordini recenti</h1>
<table class="table" id="orders-table">
  <thead>
    <tr><th>#</th><th>Ora</th><th>Cassa</th><th>Totale</th><th>Azioni</th></tr>
  </thead>
  <tbody></tbody>
</table>
<div class="pagination">
  <button id="orders-prev" type="button">◄ Precedente</button>
  <span id="orders-page-info" class="status"></span>
  <button id="orders-next" type="button">Successiva ►</button>
</div>
<dialog id="order-detail">
  <button id="order-detail-close" type="button" aria-label="Chiudi">✕</button>
  <div id="order-detail-body"></div>
</dialog>
<script>
const money = cents => `€ ${(cents / 100).toFixed(2).replace('.', ',')}`;
function escapeHtml(value) {
  return String(value ?? '')
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}
const ORDERS_PAGE_SIZE = 20;
let ordersOffset = 0;

async function loadOrders() {
  const res = await fetch(`/api/orders?limit=${ORDERS_PAGE_SIZE}&offset=${ordersOffset}`);
  const { orders, total, limit, offset } = await res.json();
  document.querySelector('#orders-table tbody').innerHTML = orders.map(o => `
    <tr>
      <td>${o.order_number}</td>
      <td>${o.created_at_display ?? o.created_at}</td>
      <td>${o.cashier_name ?? ''}</td>
      <td>${money(o.total_cents)}</td>
      <td>
        <button data-id="${o.id}">Ristampa</button>
        <button data-view-id="${o.id}">Visualizza</button>
      </td>
    </tr>
  `).join('');
  const rangeStart = total === 0 ? 0 : offset + 1;
  const rangeEnd = Math.min(offset + limit, total);
  document.querySelector('#orders-page-info').textContent = `${rangeStart}–${rangeEnd} di ${total}`;
  document.querySelector('#orders-prev').disabled = offset === 0;
  document.querySelector('#orders-next').disabled = offset + limit >= total;
}
async function showOrderDetail(id) {
  const res = await fetch(`/api/orders/${id}`);
  if (!res.ok) {
    alert(await res.text());
    return;
  }
  const { order, items } = await res.json();
  const rows = items.map(item => `
    <tr>
      <td>${escapeHtml(item.name_snapshot)}</td>
      <td>${item.quantity}</td>
      <td>${money(item.price_cents_snapshot)}</td>
      <td>${money(item.line_total_cents)}</td>
    </tr>
  `).join('');
  document.querySelector('#order-detail-body').innerHTML = `
    <h2>Ordine #${order.order_number}</h2>
    <p class="page-subtitle">
      ${escapeHtml(order.created_at_display ?? order.created_at)}
      &middot; ${escapeHtml(order.cashier_name ?? '')}
      &middot; ${escapeHtml(order.status)}
    </p>
    <table class="table">
      <thead>
        <tr><th>Prodotto</th><th>Qtà</th><th>Prezzo</th><th>Totale</th></tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
    <p class="page-subtitle"><strong>Totale ordine: ${money(order.total_cents)}</strong></p>
  `;
  document.querySelector('#order-detail').showModal();
}
document.addEventListener('click', async event => {
  if (event.target.matches('button[data-view-id]')) {
    showOrderDetail(event.target.dataset.viewId);
    return;
  }
  if (event.target.id === 'order-detail-close' || event.target.id === 'order-detail') {
    document.querySelector('#order-detail').close();
    return;
  }
  if (event.target.id === 'orders-prev') {
    ordersOffset = Math.max(0, ordersOffset - ORDERS_PAGE_SIZE);
    loadOrders();
    return;
  }
  if (event.target.id === 'orders-next') {
    ordersOffset += ORDERS_PAGE_SIZE;
    loadOrders();
    return;
  }
  if (!event.target.matches('button[data-id]')) return;
  const id = event.target.dataset.id;
  event.target.disabled = true;
  try {
    const res = await fetch(`/api/orders/${id}/reprint`, {method: 'POST'});
    if (!res.ok) throw new Error(await res.text());
    event.target.textContent = 'Ristampato';
  } catch (err) {
    alert(err.message);
    event.target.disabled = false;
  }
});
loadOrders();
</script>
{% endblock %}
